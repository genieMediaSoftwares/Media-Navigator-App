# Render Blueprint for the Media Navigator API (Backend/).
# https://render.com/docs/blueprint-spec
#
# Values marked `sync: false` are secrets: Render asks for them when the Blueprint is created and
# they are stored only in Render. Never commit their values. MONGODB_URI must point to a remotely
# reachable database (e.g. MongoDB Atlas) — Render cannot reach a MongoDB running on your computer.
services:
  - type: web
    name: media-navigator-api
    runtime: node
    rootDir: Backend
    plan: starter
    # devDependencies (TypeScript) are needed for the build even though NODE_ENV is production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      # Render terminates TLS in front of the service: one proxy hop.
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_BASE_URL
        value: https://generativelanguage.googleapis.com
      - key: GEMINI_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_API_VERSION
        value: v21.0
      - key: META_GRAPH_BASE_URL
        value: https://graph.facebook.com
      - key: FACEBOOK_OAUTH_BASE_URL
        value: https://www.facebook.com
      - key: INSTAGRAM_GRAPH_BASE_URL
        value: https://graph.instagram.com
      - key: META_REDIRECT_URI
        sync: false
      - key: FACEBOOK_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: YOUTUBE_DATA_API_BASE_URL
        value: https://www.googleapis.com/youtube/v3
      - key: YOUTUBE_ANALYTICS_API_BASE_URL
        value: https://youtubeanalytics.googleapis.com/v2/reports
      - key: GOOGLE_OAUTH_TOKEN_URL
        value: https://oauth2.googleapis.com/token
      - key: GOOGLE_OAUTH_AUTH_URL
        value: https://accounts.google.com/o/oauth2/v2/auth
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: LINKEDIN_API_VERSION
        value: "202509"
      - key: LINKEDIN_API_BASE_URL
        value: https://api.linkedin.com/rest
      - key: LINKEDIN_OAUTH_BASE_URL
        value: https://www.linkedin.com/oauth/v2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      # Only needed for the Expo web target; native apps send no Origin header. Comma-separated exact
      # origins. Auth uses bearer tokens (no cookies), so allowing the local Expo web dev server is safe.
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:8081,http://127.0.0.1:8081"
      - key: APP_REDIRECT_SCHEMES
        value: medianavigator,exp
      - key: DEFAULT_RETURN_URL
        value: medianavigator://oauth/callback
      - key: HTTP_REQUEST_TIMEOUT_MS
        value: "20000"
      - key: MEDIA_PAGE_SIZE
        value: "25"
      # Safety ceiling only: 400 × 25 covers Instagram's 10,000-media maximum.
      - key: MAX_MEDIA_PAGES
        value: "400"
      - key: AUTO_SYNC_INTERVAL_MS
        value: "21600000"
      - key: FULL_SYNC_INTERVAL_MS
        value: "86400000"
      - key: FACEBOOK_POSTS_PAGE_SIZE
        value: "25"
      - key: FACEBOOK_MAX_POST_PAGES
        value: "8"
      - key: YOUTUBE_MAX_VIDEOS
        value: "200"
      - key: LINKEDIN_MAX_POSTS
        value: "100"
      - key: OAUTH_STATE_TTL_MS
        value: "600000"
      - key: PENDING_CONNECTION_TTL_MS
        value: "900000"
      - key: AI_CACHE_TTL_MS
        value: "604800000"
      - key: AUTH_RATE_LIMIT
        value: "30"
      - key: API_RATE_LIMIT
        value: "300"
      - key: AI_REQUESTS_PER_HOUR
        value: "40"
