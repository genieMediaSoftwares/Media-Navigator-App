# Render Blueprint for the Media Navigator API (Backend/).
# https://render.com/docs/blueprint-spec
#
# Values marked `sync: false` are secrets: Render asks for them when the Blueprint is created and
# they are stored only in Render. Never commit their values. MONGODB_URI must point to a remotely
# reachable database (e.g. MongoDB Atlas) — Render cannot reach a MongoDB running on your computer.
services:
  - type: web
    name: media-navigator-api
    runtime: node
    rootDir: Backend
    plan: starter
    # devDependencies (TypeScript) are needed for the build even though NODE_ENV is production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Render terminates TLS in front of the service: one proxy hop.
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_API_VERSION
        value: v21.0
      - key: META_REDIRECT_URI
        sync: false
      - key: FACEBOOK_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      # Only needed for the Expo web target; native apps send no Origin header.
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: APP_REDIRECT_SCHEMES
        value: medianavigator,exp
